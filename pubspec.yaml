name: medical
description: "An app that predicts diseases based on the user's diagnosis"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.5.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/medical.png"
  remove_alpha_ios: true
